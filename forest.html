<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061311">
  <title>숲 속의 요정</title>
  <style>
    @font-face { font-family: Galmuri; src: url('assets/fonts/Galmuri11.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: Galmuri; src: url('assets/fonts/Galmuri11-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    :root { color-scheme: dark; --ink:#141d38; --panel:#1d2d46; --edge:#7eabc0; --cream:#fff1b1; --mint:#9ee1c4; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#080e20; }
    body { color:#e1eced; font:12px/1.7 Galmuri,'DotumChe',monospace; }
    canvas { display:block; width:100%; height:100%; touch-action:none; image-rendering:pixelated; cursor:url('leaf-cursor.svg') 4 4,crosshair; }
    .panel { position:fixed; top:24px; left:28px; right:28px; pointer-events:none; }
    .eyebrow { margin:0 0 8px; font-size:10px; color:var(--mint); letter-spacing:2px; text-shadow:2px 2px var(--ink); }
    .toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; pointer-events:auto; }
    h1 { margin:0 auto 0 0; color:#ffe58d; font-size:32px; line-height:1.5; letter-spacing:2px; font-weight:700; text-shadow:3px 3px #ab535b,6px 6px #111c35; }
    button,summary,input::file-selector-button { border:2px solid var(--ink); border-radius:0; background:#e8d291; color:#27324a; box-shadow:inset 2px 2px #fff3bf,inset -2px -2px #bd9e68,3px 3px 0 #111a30; padding:10px 12px; font:11px/1.5 Galmuri,monospace; cursor:pointer; }
    button:hover,summary:hover,input::file-selector-button:hover { background:#fff0b5; }
    button:active { transform:translate(2px,2px); box-shadow:inset 2px 2px #bd9e68; }
    button:focus-visible,summary:focus-visible,input:focus-visible { outline:3px solid #92e8d3; outline-offset:4px; }
    button:disabled { opacity:.5; cursor:default; }
    #camera-on { background:#b2dbc1; box-shadow:inset 2px 2px #e1f5d8,inset -2px -2px #71a697,3px 3px #111a30; }
    .description { display:inline-block; margin:14px 0 0; padding:7px 10px; background:#121d35e6; border-left:3px solid var(--mint); color:#d7e5e4; font-size:11px; max-width:100%; }
    #gift-count { display:inline-block; margin-left:12px; color:#ffe29a; white-space:nowrap; }
    .settings { position:relative; }
    summary { list-style:none; white-space:nowrap; }
    summary::-webkit-details-marker { display:none; }
    summary::before { content:'+ '; }
    details[open] summary::before { content:'− '; }
    .settings-content { position:absolute; right:0; top:calc(100% + 10px); display:grid; gap:12px; width:290px; padding:16px; background:var(--panel); border:2px solid var(--edge); box-shadow:4px 4px var(--ink),inset 0 0 0 3px #101b31; }
    .upload { display:grid; gap:5px; color:var(--mint); font-size:11px; }
    input[type=file] { width:100%; min-width:0; color:#c1d2dc; font:10px Galmuri,monospace; }
    input::file-selector-button { padding:5px; margin-right:6px; font-size:10px; box-shadow:none; }
    .camera-preview { position:fixed; bottom:24px; left:28px; margin:0; display:flex; align-items:center; gap:16px; padding:20px 16px 14px; max-width:calc(100vw - 56px); background:#192941f5; border:2px solid #8bb6c5; box-shadow:4px 4px #0a152b,inset 0 0 0 3px #101a32; }
    .camera-preview::before { content:'PLAYER 01 / RUDOLPH'; position:absolute; top:-10px; left:12px; padding:0 7px; color:#f8e6a7; background:#192941; font-size:10px; letter-spacing:1px; }
    .camera-orb { position:relative; display:grid; place-items:center; width:84px; height:84px; flex-shrink:0; border:2px solid #5b8399; background:#101b32; overflow:hidden; box-shadow:inset 0 0 0 3px #0a1428; }
    .camera-orb video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); visibility:hidden; image-rendering:pixelated; }
    .camera-orb.live video { visibility:visible; }
    .camera-orb span { color:#8aafbf; font-size:10px; text-align:center; }
    .camera-orb.live span { display:none; }
    .camera-preview figcaption { min-width:0; width:210px; font-size:10px; }
    #face-status { margin:0 0 10px; color:#c3d6df; line-height:1.8; }
    .zoom-label { display:flex; justify-content:space-between; gap:8px; color:#f9e7aa; }
    #face-zoom { display:block; width:100%; margin:10px 0 6px; accent-color:#9ddabc; cursor:pointer; }
    #face-zoom { appearance:none; -webkit-appearance:none; height:10px; border:2px solid #101a32; background:#4b6c80; border-radius:0; }
    #face-zoom::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; width:14px; height:16px; border:2px solid #14233c; border-radius:0; background:#b0e1bd; box-shadow:inset 2px 2px #ecf2cd; }
    #face-zoom::-moz-range-thumb { width:12px; height:14px; border:2px solid #14233c; border-radius:0; background:#b0e1bd; }
    .zoom-limits { display:flex; justify-content:space-between; color:#89aabc; font-size:9px; }
    #status { position:fixed; left:28px; bottom:182px; color:#ffe6a6; max-width:min(440px,85vw); pointer-events:none; background:#13223be8; padding:5px 8px; font-size:11px; }
    #status:empty { display:none; }
    .controls { position:fixed; right:28px; bottom:28px; display:flex; gap:10px; }
    .scene-credit { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); color:#afcfdb; text-align:center; font-size:9px; letter-spacing:1px; text-shadow:2px 2px #111b30; pointer-events:none; }
    .scene-credit strong { display:block; color:#ffe4a5; font-weight:400; font-size:11px; margin-bottom:4px; }
    @media(max-width:1000px) { .scene-credit { display:none; } h1 { font-size:26px; } }
    @media(max-width:650px) {
      .panel { top:14px; left:14px; right:14px; } .eyebrow { font-size:8px; margin-bottom:6px; letter-spacing:1px; }
      h1 { width:100%; font-size:26px; margin:0 0 5px; } .toolbar { gap:8px; }
      button,summary { font-size:10px; padding:8px 10px; } .description { font-size:10px; margin-top:10px; line-height:1.8; }
      .camera-preview { left:14px; right:14px; bottom:70px; padding:18px 12px 10px; gap:12px; max-width:none; }
      .camera-orb { width:64px; height:70px; } .camera-preview figcaption { width:auto; flex:1; }
      #face-status { margin-bottom:6px; } .controls { right:14px; bottom:16px; } #status { left:14px; bottom:220px; }
      .settings-content { right:auto; left:0; transform:translateX(-164px); width:290px; }
    }
    @media(prefers-reduced-motion:reduce) { button:active { transform:none; } }
  </style>
</head>
<body>
  <canvas id="forest" aria-label="눈 덮인 전나무와 잎 없는 겨울나무, 높낮이가 다른 얼음 지형이 겹쳐진 픽셀 아트 숲. 마우스나 손가락을 움직이면 요정과 작은 빛이 따라옵니다."></canvas>
  <header class="panel">
    <p class="eyebrow">WINTER FOREST · FROZEN WOODS</p>
    <div class="toolbar">
      <h1>숲 속의 요정</h1>
      <button id="camera-on" type="button">웹캠 켜기</button><button id="camera-off" type="button" disabled>웹캠 끄기</button>
      <details class="settings"><summary>이미지 바꾸기</summary><div class="settings-content">
        <label class="upload">숲 배경 <input id="forest-file" type="file" accept="image/*"></label>
        <label class="upload">요정 불빛 <input id="light-file" type="file" accept="image/*"></label>
      </div></details>
    </div>
    <p class="description">선물 가까이에서 클릭해 냠! 웹캠을 켰다면 입을 크게 벌려보세요. <span id="gift-count" aria-live="polite">선물 0 / 0</span></p>
  </header>
  <figure class="camera-preview" aria-label="웹캠 미리보기">
    <div class="camera-orb"><video id="camera-video" autoplay muted playsinline aria-label="실시간 웹캠 영상"></video><span>CAMERA<br>OFF</span></div>
    <figcaption>
      <p id="face-status" role="status" aria-live="polite">웹캠을 켜면 내 눈과 입이 요정에게 나타나요</p>
      <label class="zoom-label" for="face-zoom">눈·입 크기 <output id="zoom-value" for="face-zoom">1.0배</output></label>
      <input id="face-zoom" type="range" min="0.8" max="1.5" step="0.1" value="1" aria-valuetext="1.0배">
      <div class="zoom-limits" aria-hidden="true"><span>0.8배</span><span>1.5배</span></div>
    </figcaption>
  </figure>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="controls"><button id="sound-toggle" type="button" aria-pressed="true">효과음 켜짐</button><button id="pause" type="button" aria-pressed="false">움직임 멈추기</button><button id="fullscreen" type="button">전체 화면</button></div>
  <div class="scene-credit"><strong>FROZEN FOREST</strong>손짓으로 여는 AI 세계 · 이윤진</div>
  <script>
    'use strict';
    const canvas = document.querySelector('#forest');
    const screen = canvas.getContext('2d');
    const scene = document.createElement('canvas');
    const ctx = scene.getContext('2d');
    const pixelSize = 2;
    const scenery = document.createElement('canvas');
    const bg = scenery.getContext('2d');
    let w, h, dpr, last = 0, time = 0, paused = false, frame;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const pointer = { x: 0, y: 0, active: false, strength: 0 };
    const fairy = { x: 0, y: 0, walk: 0, step: 0, facing: 1 };
    const companions = [
      { offsetX: -86, offsetY: -38, speed: .78 },
      { offsetX: -128, offsetY: 35, speed: .65 },
      { offsetX: -174, offsetY: -8, speed: .55 }
    ].map(p => ({ ...p, x: 0, y: 0 }));
    const leaves = [];
    const treeHooks = [], gifts = [];
    const giftCount = document.querySelector('#gift-count');
    let forestAsleep = true, biteTime = 0;
    let soundEnabled = true, audioContext = null, audioOutput = null, crunchBuffer = null;
    function buildCrunchBuffer(context) {
      const buffer=context.createBuffer(1,Math.ceil(context.sampleRate*.52),context.sampleRate);
      const data=buffer.getChannelData(0);let seed=9173,filtered=0;
      for(let i=0;i<data.length;i++) {
        const t=i/context.sampleRate;let value=0;
        for(const start of [0,.16,.32]) {
          const age=t-start;if(age<0||age>.13)continue;
          seed=(seed*16807)%2147483647;const noise=(seed/2147483647)*2-1;
          filtered=filtered*.38+noise*.62;
          const envelope=Math.min(1,age/.004)*Math.exp(-age/ .032);
          const crack=Math.abs(noise)>.88?noise*.65:0;
          const chomp=Math.sin(2*Math.PI*(240*age+7*(1-Math.exp(-age/ .018))));
          value+=(filtered*.55+crack+chomp*.18)*envelope;
        }
        data[i]=Math.max(-.85,Math.min(.85,value));
      }
      return buffer;
    }
    function unlockAudio() {
      if(!soundEnabled)return;
      try {
        if(!audioContext) {
          const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
          audioContext=new Audio();audioOutput=audioContext.createGain();
          audioOutput.gain.value=.4;audioOutput.connect(audioContext.destination);
          crunchBuffer=buildCrunchBuffer(audioContext);
        }
        if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
      } catch { /* Sound is optional; eating still works when audio is unavailable. */ }
    }
    function playCrunch() {
      if(!soundEnabled||!audioContext||audioContext.state!=='running'||!crunchBuffer)return false;
      try {
        const source=audioContext.createBufferSource();source.buffer=crunchBuffer;
        source.connect(audioOutput);source.onended=()=>source.disconnect();source.start();return true;
      } catch { return false; }
    }
    // Unlock audio during a real interaction, including the webcam-on button.
    document.addEventListener('pointerdown',unlockAudio,{capture:true});
    document.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' ')unlockAudio();},{capture:true});
    document.querySelector('#sound-toggle').addEventListener('click',event=>{
      soundEnabled=!soundEnabled;unlockAudio();
      if(audioOutput)audioOutput.gain.setValueAtTime(soundEnabled?.4:0,audioContext.currentTime);
      event.currentTarget.setAttribute('aria-pressed',String(soundEnabled));
      event.currentTarget.textContent=soundEnabled?'효과음 켜짐':'효과음 꺼짐';
    });
    let mouthOpen = false, mouthArmed = true, mouthOpenedAt = 0;
    let lastMove = -Infinity, forestImage = null, lightImage = null, cameraStream = null, cameraRequest = 0;
    const video = document.querySelector('#camera-video'); video.muted = true; video.playsInline = true;
    const cameraOrb = document.querySelector('.camera-orb');
    const faceStatus = document.querySelector('#face-status');
    const zoomSlider = document.querySelector('#face-zoom');
    let faceZoom = 1;
    let faceLandmarker = null, detectorPromise = null, faceFeatures = null, faceFrame = null;
    let lastDetection = -Infinity, lastVideoTime = -1, faceSeen = -Infinity;
    const status = document.querySelector('#status');
    let seed = 4321;
    const random = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const flies = Array.from({ length: 65 }, () => ({ x: random(), y: .18 + random() * .76, phase: random() * Math.PI * 2, speed: .15 + random() * .3, size: .5 + random() * 1.4 }));
    const sparkles = Array.from({ length: 28 }, () => ({ angle: random() * Math.PI * 2, radius: 16 + random() * 55, phase: random() * Math.PI * 2, speed: .8 + random() * .8, size: .5 + random() * 1.1 }));

    function block(context, x, y, width, height, color) {
      context.fillStyle = color; context.fillRect(Math.round(x / 2) * 2, Math.round(y / 2) * 2, Math.ceil(width / 2) * 2, Math.ceil(height / 2) * 2);
    }
    function glow(context, x, y, radius, color, alpha) {
      context.save();
      for (let ring = 4; ring > 0; ring--) {
        const r = Math.round(radius * ring / 4 / 4) * 4;
        block(context, x - r, y - r, r * 2, r * 2, `rgba(${color},${alpha * .035})`);
      }
      context.restore();
    }
    function pixelPine(x, y, height, festive = false) {
      const u = Math.max(2, Math.round(height / 75 / 2) * 2);
      block(bg,x-u*2,y-height*.35,u*4,height*.37,'#344e6a');
      block(bg,x-u,y-height*.35,u,height*.36,'#557386');
      for(let tier=0;tier<6;tier++) {
        const top=y-height+tier*height*.13, half=height*(.07+tier*.027), rowHeight=height*.032;
        for(let row=0;row<6;row++) {
          const width=half*(.25+row*.16), yy=top+row*rowHeight;
          block(bg,x-width,yy,width*2,rowHeight+2,row<3?'#568d85':row<5?'#366e72':'#285464');
          if(row<4) {
            const snowWidth=width*(row===0?1:.85);
            block(bg,x-snowWidth,yy-2,snowWidth*2,Math.max(4,rowHeight*.65),row<2?'#f0f7ef':'#c7e5e6');
            block(bg,x-snowWidth*.6,yy+rowHeight*.45,snowWidth*.3,4,'#e8f4ed');
          }
        }
        if(festive&&tier>1)for(let j=0;j<4;j++)block(bg,x-half*.65+j*half*.43,top+rowHeight*5,4,4,j%2?'#ffdf98':'#e58c9d');
      }
      if(festive)pixelStar(bg,x,y-height-4,4,'#ffe9ab');
    }
    function bareWinterTree(x, base, height, width, trunk, snow, collectHooks = false) {
      block(bg,x-width/2,base-height,width,height,trunk);
      block(bg,x-width/2,base-height,width*.22,height,snow);
      for(let fork=0;fork<5;fork++) {
        const side=fork%2?1:-1, yy=base-height*(.25+fork*.14);
        const reach=height*(.11+(fork%3)*.025), rise=height*.12;
        for(let step=0;step<7;step++) {
          const t=step/6,xx=x+side*reach*t,by=yy-rise*t;
          const thick=Math.max(2,width*(.48-t*.28));
          block(bg,xx-thick/2,by,thick+reach/6,thick+rise/6,trunk);
          if(fork%2===0&&step>4)block(bg,xx-thick/2,by-2,thick+reach/7,2,snow);
        }
        const endX=x+side*reach,endY=yy-rise;
        if(collectHooks && endX>w*.05 && endX<w*.95 && endY>h*.25 && endY<h*.65) treeHooks.push({x:endX,y:endY});
        block(bg,endX,endY-height*.07,Math.max(2,width*.14),height*.07,trunk);
      }
      block(bg,x-width,base-6,width*2,8,trunk);
    }
    function iceTerrace(x, top, width, bottom, distant = false) {
      const deep=distant?'#447b9e':'#193566',edge=distant?'#75b4c7':'#315d8c';
      block(bg,x,top,width,bottom-top,deep);
      block(bg,x,top,width,20,edge);
      for(let px=x;px<x+width;px+=8) {
        const xx=Math.min(px,x+width-2),span=Math.min(8,x+width-xx);
        block(bg,xx,top-8-(Math.floor(px/8)%3===0?2:0),span,10,'#edf8f2');
        block(bg,xx,top+2,span,4,Math.floor(px/8)%2?'#b7e1e7':'#d7eff0');
        if(Math.floor(px/8)%4===0)block(bg,xx,top+6,2,10+random()*12,'#82c8dd');
      }
      const count=Math.floor(width*(bottom-top)/600);
      for(let i=0;i<count;i++) {
        const px=x+random()*width,py=top+12+random()*Math.max(1,bottom-top-14);
        if(py<top+48||random()<.2)block(bg,px,py,2+random()*4,2,i%3?'#295180':'#3c80a3');
      }
      for(let py=top+8;py<bottom;py+=8) {
        if(x>0)block(bg,x,py,2+random()*5,6,edge);
        if(x+width<w)block(bg,x+width-4-random()*4,py,4+random()*4,6,edge);
      }
    }
    function iceCrystal(x,y,scale=1) {
      const u=Math.max(2,Math.round(scale*3/2)*2);
      for(const [dx,height] of [[-4,6],[0,11],[4,8]]) {
        block(bg,x+dx*u,y-height*u,u*3,height*u,'#2c87b2');
        block(bg,x+(dx+1)*u,y-(height+1)*u,u,u,'#cbfaff');
        block(bg,x+(dx+1)*u,y-height*u,u,height*u,'#76d9ed');
        block(bg,x+dx*u,y-(height-2)*u,u,u*3,'#a2edee');
      }
      block(bg,x-u*6,y-u,u*13,u,'#edf8f2');
    }
    function snowShrub(x,y,scale=1) {
      const u=Math.max(2,Math.round(scale*2/2)*2);
      block(bg,x-u*5,y-u*3,u*10,u*3,'#a5d5df');
      block(bg,x-u*3,y-u*5,u*6,u*4,'#d6eeee');
      block(bg,x-u,y-u*7,u*2,u*6,'#f4faf2');
      block(bg,x-u*5,y-u*4,u*3,u*2,'#eff8f2');
      block(bg,x+u*2,y-u*4,u*3,u*2,'#eff8f2');
    }
    function pixelStar(context, x, y, size, color) {
      block(context, x - size / 2, y - size * 1.5, size, size * 3, color);
      block(context, x - size * 1.5, y - size / 2, size * 3, size, color);
      block(context, x - size / 2, y - size / 2, size, size, '#fff8d0');
    }
    function buildForest() {
      seed=9517; treeHooks.length=0;
      const colors=['#325979','#467a98','#5b98b2','#79bacb','#9fd7de','#bde8e7'];
      for(let i=0;i<colors.length;i++)block(bg,0,h*i/6,w,h/6+2,colors[i]);
      // Dense bare winter woods: each row has its own scale and blue atmospheric tint.
      for(let layer=0;layer<3;layer++) {
        const count=[28,18,9][layer], base=h*[.8,.87,.95][layer];
        for(let i=0;i<count;i++) {
          const x=(i+.25+(random()-.5)*.5)/count*w;
          const height=h*(.6+random()*.5), width=[4,8,15][layer]*(.7+random()*.6);
          bareWinterTree(x,base,height,width,['#75aabd','#6093ab','#48758f'][layer],['#84b7c7','#6fa1b5','#56839b'][layer],layer===2);
        }
      }
      // Upper side ledges and lower shelves form stacked, side-scrolling forest tiers.
      iceTerrace(0,h*.31,w*.24,h*.42,true);
      iceTerrace(w*.78,h*.33,w*.22,h*.44,true);
      pixelPine(w*.16,h*.31,h*.21);
      pixelPine(w*.88,h*.33,h*.23);
      iceTerrace(0,h*.5,w*.16,h*.63,true);
      iceTerrace(w*.83,h*.44,w*.17,h*.57,true);
      for(let i=0;i<16;i++) {
        const x=i*w/15,base=h*(.82+Math.sin(i)*.035);
        pixelPine(x,base,h*(.2+random()*.16));
      }
      // Tall, heavily snowed conifers establish the middle plane.
      pixelPine(w*.075,h*.67,h*.61);
      pixelPine(w*.27,h*.81,h*.51);
      pixelPine(w*.72,h*.74,h*.69);
      pixelPine(w*.95,h*.62,h*.59);
      // Contiguous stepped platforms: high side ledges and a lower central clearing.
      const terraces=[[0,.2,.67],[.2,.14,.81],[.34,.3,.89],[.64,.19,.74],[.83,.17,.62]];
      for(const [x,width,top] of terraces)iceTerrace(w*x,h*top,w*width,h+4);
      const unit=Math.max(.6,Math.min(w/1200,h/800));
      for(const [x,y] of [[.03,.67],[.17,.67],[.23,.81],[.31,.81],[.4,.89],[.58,.89],[.67,.74],[.79,.74],[.85,.62],[.97,.62]]) {
        snowShrub(w*x,h*y,unit);
      }
      iceCrystal(w*.665,h*.74,unit*1.2);iceCrystal(w*.14,h*.67,unit*.8);
      iceCrystal(w*.89,h*.62,unit);

          if (kind === '숲') forestImage = image; else lightImage = image;
          status.textContent = `${kind} 이미지를 바꿨어요. 마우스를 움직여 확인하세요.`;
          if (paused) draw(0);
        } catch { if (current === version) { event.target.value = ''; status.textContent = '이미지를 열 수 없어요. PNG, JPG, WebP 파일을 선택해 주세요.'; } }
        finally { URL.revokeObjectURL(url); }
      });
    }
    const cameraOn = document.querySelector('#camera-on'), cameraOff = document.querySelector('#camera-off');
    async function loadFaceLandmarker() {
      if (!detectorPromise) {
        detectorPromise = (async () => {
          const { FaceLandmarker, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/vision_bundle.mjs');
          const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm');
          return FaceLandmarker.createFromOptions(files, {
            baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: 'CPU' },
            runningMode: 'VIDEO', numFaces: 3, minFaceDetectionConfidence: .55,
            minFacePresenceConfidence: .55, minTrackingConfidence: .5
          });
        })().catch(error => { detectorPromise = null; throw error; });
      }
      return detectorPromise;
    }
    function setFaceMessage(message) { if (faceStatus.textContent !== message) faceStatus.textContent = message; }
    // Ordered contours from MediaPipe Face Mesh: eyes and the outer lip only.
    const featureContours = {
      rightEye: [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246],
      leftEye: [263,249,390,373,374,380,381,382,362,398,384,385,386,387,388,466],
      mouth: [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185]
    };
    const featurePatches = Object.fromEntries(Object.keys(featureContours).map(name => {
      const patch = document.createElement('canvas'); patch.width = 160; patch.height = 100;
      return [name, { canvas: patch, context: patch.getContext('2d'), aspect: 1 }];
    }));
    function extractFeatures(landmarks, source, width, height) {
      for (const [name, indices] of Object.entries(featureContours)) {
        const points = indices.map(i => ({ x: landmarks[i].x * width, y: landmarks[i].y * height }));
        const minX = Math.min(...points.map(p => p.x)), maxX = Math.max(...points.map(p => p.x));
        const minY = Math.min(...points.map(p => p.y)), maxY = Math.max(...points.map(p => p.y));
        const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
        // A tiny margin keeps eyelids/lip edges, including nearly closed eyes.
        const margin = Math.max(1, (maxX - minX) * .025);
        const left = Math.max(0, minX - margin), top = Math.max(0, minY - margin);
        const right = Math.min(width, maxX + margin), bottom = Math.min(height, maxY + margin);
        if (right <= left || bottom <= top) return null;
        const part = featurePatches[name], pc = part.context;
        part.aspect = (bottom - top) / (right - left);
        pc.clearRect(0, 0, part.canvas.width, part.canvas.height); pc.save();
        pc.scale(part.canvas.width / (right - left), part.canvas.height / (bottom - top));
        pc.translate(-left, -top); pc.beginPath();
        points.forEach((p, i) => {
          const dx = p.x - cx, dy = p.y - cy, distance = Math.hypot(dx, dy) || 1;
          const x = p.x + dx / distance * margin, y = p.y + dy / distance * margin;
          if (i === 0) pc.moveTo(x, y); else pc.lineTo(x, y);
        });
        pc.closePath(); pc.clip();
        pc.drawImage(source, 0, 0, width, height); pc.restore();
      }
      return featurePatches;
    }
    function faceArea(points) {
      const xs = points.map(p => p.x), ys = points.map(p => p.y);
      return (Math.max(...xs) - Math.min(...xs)) * (Math.max(...ys) - Math.min(...ys));
    }
    zoomSlider.addEventListener('input', () => {
      faceZoom = Math.max(.8, Math.min(1.5, Number(zoomSlider.value)));
      const label = `${faceZoom.toFixed(1)}배`;
      document.querySelector('#zoom-value').textContent = label;
      zoomSlider.setAttribute('aria-valuetext', label);
      if (paused) draw(0);
    });
    function trackFace(now) {
      if (!cameraStream || !faceLandmarker) return;
      if (video.readyState >= 2 && now - lastDetection >= 100 && video.currentTime !== lastVideoTime) {
        lastDetection = now; lastVideoTime = video.currentTime;
        try {
          const faces = faceLandmarker.detectForVideo(video, now).faceLandmarks;
          const landmarks = faces.sort((a, b) => faceArea(b) - faceArea(a))[0];
          if (landmarks) {
            faceFeatures = extractFeatures(landmarks, video, video.videoWidth, video.videoHeight);
            faceSeen = now; updateMouthGesture(landmarks,now,video.videoWidth,video.videoHeight);
            setFaceMessage(mouthOpen?'입을 벌렸어요 · 선물 가까이 가보세요':'선물 앞에서 입을 크게 벌려보세요');
          } else if (now - faceSeen > 450) {
            faceFeatures = null; mouthOpen=false;mouthArmed=true;setFaceMessage('눈과 입을 찾고 있어요');
          }
          if (paused) draw(0);
        } catch {
          stopCamera(); status.textContent = '얼굴 인식이 중단됐어요. 웹캠 켜기를 눌러 다시 시도해 주세요.';
          return;
        }
      }
      faceFrame = requestAnimationFrame(trackFace);
    }
    function stopCamera() {
      cameraRequest++;
      cancelAnimationFrame(faceFrame); faceFrame = null; faceFeatures = null;
      mouthOpen=false;mouthArmed=true;mouthOpenedAt=0;
      lastDetection = -Infinity; lastVideoTime = -1; faceSeen = -Infinity;
      if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null; video.srcObject = null; cameraOn.disabled = false; cameraOff.disabled = true;
      cameraOrb.classList.remove('live'); setFaceMessage('웹캠을 켜면 내 눈과 입이 요정에게 나타나요');
      if (paused) draw(0);
    }
    cameraOn.addEventListener('click', async () => {
      const request = ++cameraRequest; cameraOn.disabled = true; cameraOff.disabled = false;
      status.textContent = 'Chrome에서 카메라 사용을 허용해 주세요.';
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('unsupported');
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false });
        if (request !== cameraRequest) { stream.getTracks().forEach(track => track.stop()); return; }
        cameraStream = stream; video.srcObject = stream; await video.play();
        if (request !== cameraRequest) return;
        cameraOrb.classList.add('live'); setFaceMessage('얼굴 인식을 준비하고 있어요');
        stream.getVideoTracks()[0].addEventListener('ended', () => { if (cameraStream === stream) { stopCamera(); status.textContent = '웹캠 연결이 종료되었어요.'; } });
        status.textContent = '얼굴 인식 파일을 불러오고 있어요. 처음에는 잠시 걸릴 수 있어요.';
        const detector = await loadFaceLandmarker();
        if (request !== cameraRequest) return;
        faceLandmarker = detector; setFaceMessage('눈과 입을 찾고 있어요');
        status.textContent = '얼굴이 보이도록 카메라를 바라보고 마우스를 움직여 보세요.';
        faceFrame = requestAnimationFrame(trackFace);
      } catch (error) {
        if (request !== cameraRequest) return;
        stopCamera();
        status.textContent = error.name === 'NotAllowedError' ? '카메라 사용이 허용되지 않았어요. Chrome의 카메라 권한을 확인해 주세요.' : error.name === 'NotFoundError' || error.name === 'NotReadableError' ? '웹캠 연결 상태와 다른 앱의 카메라 사용 여부를 확인해 주세요.' : '얼굴 인식을 준비하지 못했어요. 인터넷 연결을 확인하고 웹캠 켜기를 다시 눌러 주세요.';
      }
    });
    cameraOff.addEventListener('click', () => { stopCamera(); status.textContent = '웹캠을 껐어요.'; });
    addEventListener('pagehide', stopCamera);
    addEventListener('resize', resize);
    resize();
    if (reduced) document.querySelector('#pause').click(); else frame = requestAnimationFrame(animate);
  </script>
</body>
</html>
