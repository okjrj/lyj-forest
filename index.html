<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061311">
  <title>숲 속의 요정</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { color: #cdd9c6; font-family: '바탕', Batang, Georgia, serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: url('leaf-cursor.svg') 5 4, auto; }
    .panel { position: fixed; top: 0; width: 100%; padding: 18px 24px 14px; background: linear-gradient(#050a09f5, #050a09b0, transparent); }
    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; padding-bottom: 7px; }
    h1 { position: relative; margin: 0 22px 0 0; padding: 7px 0 10px; font-size: 27px; font-weight: 400; letter-spacing: .22em; flex-shrink: 0; color: #dce8cc; text-shadow: 0 0 20px #c0d5a330, 0 2px 8px #000; }
    h1::after { content: ''; position: absolute; bottom: 0; left: 2px; width: 100%; height: 1px; background: linear-gradient(90deg, #a7be784d, transparent); }
    .upload { display: flex; align-items: center; gap: 7px; font: 11px '맑은 고딕', sans-serif; color: #9dae9f; }
    input[type=file] { width: 190px; font: 11px '맑은 고딕', sans-serif; color: #91a296; }
    input::file-selector-button { background: #14231c; color: #cdd9c6; border: 1px solid #344437; border-radius: 2px; padding: 7px; margin-right: 6px; cursor: pointer; }
    .description { margin: 8px 0 0; font-size: 12px; color: #93a397; white-space: nowrap; overflow-x: auto; line-height: 1.8; }
    #status { position: fixed; left: 24px; bottom: 174px; font: 12px '맑은 고딕', sans-serif; color: #a5b5a5; max-width: min(420px, 90vw); pointer-events: none; }
    .controls { position: fixed; right: 4vw; bottom: 4vh; display: flex; gap: 8px; }
    button { background: #0c201c88; color: #a5b5a5; border: 1px solid #9bbaa02b; padding: 10px 14px; border-radius: 2px; font: 11px '맑은 고딕', sans-serif; cursor: pointer; }
    button:hover, button:focus-visible { color: #e0ebcb; border-color: #aabd8d; outline: none; }
    button:disabled { opacity: .35; cursor: default; }
    .toolbar button { flex-shrink: 0; }
    .camera-preview { position: fixed; bottom: 24px; left: 24px; margin: 0; padding: 14px; display: flex; align-items: center; gap: 18px; max-width: calc(100vw - 48px); background: #06100de8; border: 1px solid #aabe7b26; border-radius: 12px; }
    .camera-orb { position: relative; display: grid; place-items: center; width: 106px; height: 106px; border: 1px solid #aabe7b50; border-radius: 50%; overflow: hidden; background: #09120ff0; box-shadow: 0 0 0 6px #b2c99405, 0 0 28px #b2c9940c; }
    .camera-orb video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); visibility: hidden; }
    .camera-orb.live video { visibility: visible; }
    .camera-orb span { position: absolute; color: #8f9f88; font: 11px '바탕', Batang, serif; letter-spacing: .12em; pointer-events: none; }
    .camera-orb.live span { display: none; }
    .camera-orb { flex-shrink: 0; }
    .camera-preview figcaption { min-width: 0; width: 205px; color: #8fa086; font: 10px/1.7 '맑은 고딕', sans-serif; letter-spacing: .06em; }
    #face-status { margin: 0 0 14px; }
    .zoom-label { display: flex; justify-content: space-between; gap: 8px; color: #bccbb1; }
    #face-zoom { display: block; width: 100%; margin: 10px 0 5px; accent-color: #b1c58f; cursor: pointer; }
    #face-zoom:focus-visible { outline: 1px solid #c8daa3; outline-offset: 4px; }
    .zoom-limits { display: flex; justify-content: space-between; color: #788c75; }
    @media(max-width:600px) { .panel { padding: 12px; } h1 { font-size: 20px; } }
    @media(max-width:700px) { .camera-preview { left: 12px; bottom: 68px; max-width: calc(100vw - 24px); padding: 12px; gap: 12px; } .camera-orb { width: 78px; height: 78px; } .controls { right: 12px; bottom: 14px; } #status { left: 12px; bottom: 210px; } }
  </style>
</head>
<body>
  <canvas id="forest" aria-label="반딧불이가 떠다니는 밤의 숲. 마우스나 손가락을 움직이면 요정과 작은 빛이 따라옵니다."></canvas>
  <header class="panel">
    <div class="toolbar"><h1>숲 속의 요정</h1><button id="camera-on" type="button">웹캠 켜기</button><button id="camera-off" type="button" disabled>웹캠 끄기</button><label class="upload">숲 이미지 <input id="forest-file" type="file" accept="image/*"></label><label class="upload">불빛 이미지 <input id="light-file" type="file" accept="image/*"></label></div>
    <p class="description">마우스를 움직이면 요정이 따라와요! 멈추면 요정이 서서히 어둠 속으로 사라집니다.</p>
  </header>
  <figure class="camera-preview" aria-label="웹캠 미리보기">
    <div class="camera-orb"><video id="camera-video" autoplay muted playsinline aria-label="실시간 웹캠 영상"></video><span>작은 만남</span></div>
    <figcaption>
      <p id="face-status" role="status" aria-live="polite">웹캠을 켜면 당신이 요정이 됩니다</p>
      <label class="zoom-label" for="face-zoom">요정 얼굴 확대 <output id="zoom-value" for="face-zoom">1.0배</output></label>
      <input id="face-zoom" type="range" min="0.8" max="3" step="0.1" value="1" aria-valuetext="1.0배">
      <div class="zoom-limits" aria-hidden="true"><span>0.8배</span><span>3.0배</span></div>
    </figcaption>
  </figure>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="controls"><button id="pause" type="button" aria-pressed="false">움직임 멈추기</button><button id="fullscreen" type="button">전체 화면</button></div>
  <script>
    'use strict';
    const canvas = document.querySelector('#forest');
    const ctx = canvas.getContext('2d');
    const scenery = document.createElement('canvas');
    const bg = scenery.getContext('2d');
    let w, h, dpr, last = 0, time = 0, paused = false, frame;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const pointer = { x: 0, y: 0, active: false, strength: 0 };
    const fairy = { x: 0, y: 0, walk: 0, step: 0, facing: 1 };
    const companions = [
      { offsetX: -42, offsetY: -30, speed: .78 },
      { offsetX: -68, offsetY: 26, speed: .65 },
      { offsetX: -98, offsetY: -2, speed: .55 }
    ].map(p => ({ ...p, x: 0, y: 0 }));
    const leaves = [];
    let lastMove = -Infinity, forestImage = null, lightImage = null, cameraStream = null, cameraRequest = 0;
    const video = document.querySelector('#camera-video'); video.muted = true; video.playsInline = true;
    const cameraOrb = document.querySelector('.camera-orb');
    const faceStatus = document.querySelector('#face-status');
    const zoomSlider = document.querySelector('#face-zoom');
    let faceZoom = 1;
    let faceDetector = null, detectorPromise = null, faceCrop = null, faceFrame = null;
    let lastDetection = -Infinity, lastVideoTime = -1, faceSeen = -Infinity;
    const status = document.querySelector('#status');
    let seed = 4321;
    const random = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const flies = Array.from({ length: 65 }, () => ({ x: random(), y: .18 + random() * .76, phase: random() * Math.PI * 2, speed: .15 + random() * .3, size: .5 + random() * 1.4 }));
    const sparkles = Array.from({ length: 28 }, () => ({ angle: random() * Math.PI * 2, radius: 16 + random() * 55, phase: random() * Math.PI * 2, speed: .8 + random() * .8, size: .5 + random() * 1.1 }));

    function glow(context, x, y, radius, color, alpha) {
      const gradient = context.createRadialGradient(x, y, 0, x, y, radius);
      gradient.addColorStop(0, `rgba(${color},${alpha})`);
      gradient.addColorStop(.22, `rgba(${color},${alpha * .35})`);
      gradient.addColorStop(1, `rgba(${color},0)`);
      context.fillStyle = gradient;
      context.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }

    function buildForest() {
      seed = 9517;
      const sky = bg.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#071315'); sky.addColorStop(.46, '#29433f'); sky.addColorStop(1, '#06110e');
      bg.fillStyle = sky; bg.fillRect(0, 0, w, h);
      glow(bg, w * .56, h * .4, h * .48, '128,161,143', .17);
      // Overlapping mountain ridges recede into the lighter, misty valley.
      const ridges = [
        { color: '#2c4545', points: [[-.05,.43],[.10,.25],[.27,.39],[.40,.30],[.57,.47],[.74,.28],[.92,.38],[1.06,.24]] },
        { color: '#203b38', points: [[-.05,.5],[.12,.36],[.31,.51],[.47,.43],[.61,.54],[.80,.38],[1.06,.48]] },
        { color: '#19332e', points: [[-.05,.59],[.15,.46],[.36,.57],[.54,.60],[.77,.47],[1.06,.55]] }
      ];
      for (const ridge of ridges) {
        bg.fillStyle = ridge.color; bg.beginPath(); bg.moveTo(-w * .05, h);
        ridge.points.forEach(([x, y]) => bg.lineTo(x * w, y * h));
        bg.lineTo(w * 1.06, h); bg.closePath(); bg.fill();
      }
      // Small conifers establish the far edge of the forest.
      for (let i = 0; i < 76; i++) {
        const x = i / 75 * w, base = h * (.62 + Math.sin(i * .16) * .025);
        const height = h * (.025 + random() * .075), width = height * .22;
        bg.fillStyle = i % 3 ? '#193a30' : '#204036';
        bg.beginPath(); bg.moveTo(x, base - height);
        for (let b = 0; b < 4; b++) {
          const y = base - height + height * (b + 1) / 4;
          bg.lineTo(x + width * (b + 1) / 4, y); bg.lineTo(x + width * b / 5, y);
        }
        bg.lineTo(x, base + 3);
        for (let b = 3; b >= 0; b--) {
          const y = base - height + height * (b + 1) / 4;
          bg.lineTo(x - width * (b + 1) / 4, y);
        }
        bg.closePath(); bg.fill();
      }
      const ground = bg.createLinearGradient(0, h * .59, 0, h);
      ground.addColorStop(0, '#183329'); ground.addColorStop(1, '#030d0a');
      bg.fillStyle = ground; bg.beginPath(); bg.moveTo(0, h * .69);
      bg.bezierCurveTo(w * .24, h * .64, w * .39, h * .6, w * .55, h * .62);
      bg.bezierCurveTo(w * .74, h * .61, w * .87, h * .65, w, h * .67);
      bg.lineTo(w, h); bg.lineTo(0, h); bg.closePath(); bg.fill();
      // A narrowing, gently winding clearing leads the eye toward the valley.
      const path = bg.createLinearGradient(0, h * .62, 0, h);
      path.addColorStop(0, '#38534470'); path.addColorStop(1, '#1a2b2050');
      bg.fillStyle = path; bg.beginPath(); bg.moveTo(w * .54, h * .62);
      bg.bezierCurveTo(w * .47, h * .72, w * .64, h * .76, w * .32, h);
      bg.lineTo(w * .80, h);
      bg.bezierCurveTo(w * .73, h * .78, w * .53, h * .71, w * .57, h * .62);
      bg.closePath(); bg.fill();
      // Increasing tree size and contrast frame the open center at three depths.
      for (let layer = 0; layer < 3; layer++) {
        const count = [25, 15, 8][layer];
        for (let i = 0; i < count; i++) {
          let x = (i / (count - 1) + (random() - .5) * .035) * w;
          const center = Math.abs(x / w - .54);
          if (center < [.10, .23, .34][layer]) continue;
          const width = [4, 12, 28][layer] * (.8 + random() * .8) * Math.max(.6, w / 1500);
          const lean = (random() - .5) * w * [.03, .05, .09][layer];
          const base = h * ([.73, .88, 1.06][layer] + random() * .025);
          const top = h * ([.28, .02, -.19][layer] + random() * .09);
          const height = base - top;
          bg.fillStyle = ['#152f27', '#0b211a', '#030f0b'][layer];
          bg.beginPath(); bg.moveTo(x - width, base);
          bg.bezierCurveTo(x - width * .4, base - height * .3, x + lean - width * .4, top + height * .2, x + lean - width * .3, top);
          bg.lineTo(x + lean + width * .3, top);
          bg.bezierCurveTo(x + lean + width * .6, top + height * .2, x + width * .3, base - height * .3, x + width, base);
          bg.fill();
          bg.strokeStyle = bg.fillStyle; bg.lineCap = 'round';
          for (let b = 0; b < 5; b++) {
            const y = top + height * (.08 + b * .12 + random() * .05);
            const direction = random() > .5 ? 1 : -1;
            const reach = height * (.1 + random() * .16);
            bg.lineWidth = width * (.18 + random() * .16);
            bg.beginPath(); bg.moveTo(x + lean * ((base - y) / height), y + height * .07);
            bg.quadraticCurveTo(x + direction * reach * .55, y, x + direction * reach, y - height * .09);
            bg.stroke();
          }
          if (layer === 2) {
            bg.strokeStyle = '#19302670'; bg.lineWidth = 1;
            bg.beginPath(); bg.moveTo(x - width * .35, base);
            bg.quadraticCurveTo(x - width * .2, base - height * .5, x + lean, top); bg.stroke();
          }
        }
        // Mist between the layers separates their silhouettes without animation.
        for (let i = 0; i < 4; i++) {
          bg.save(); bg.translate(w * (.22 + i * .2), h * (.65 + layer * .07)); bg.scale(3.6, .22);
          glow(bg, 0, 0, w * .09, '121,157,137', layer === 0 ? .09 : .035); bg.restore();
        }
      }
      // Soft pools of mist and a dark, uneven forest floor.
      for (let i = 0; i < 12; i++) {
        bg.save(); bg.translate(random() * w, h * (.63 + random() * .24)); bg.scale(3.8, .33);
        glow(bg, 0, 0, w * .11, '98,135,113', .035); bg.restore();
      }
      // Fine ferns and grasses frame the clearing.
      for (let i = 0; i < 165; i++) {
        const x = random() * w, y = h * (.92 + random() * .1);
        const height = 18 + random() * 95, direction = random() > .5 ? 1 : -1;
        bg.strokeStyle = i % 3 ? '#0b2119' : '#153024'; bg.lineWidth = .8;
        bg.beginPath(); bg.moveTo(x, y); bg.quadraticCurveTo(x + direction * 15, y - height * .6, x + direction * 24, y - height); bg.stroke();
        for (let j = 1; j < 7; j++) {
          const f = j / 7, px = x + direction * 24 * f, py = y - height * f;
          const leaf = (1 - f) * height * .27;
          bg.beginPath(); bg.moveTo(px - leaf, py - leaf * .6); bg.lineTo(px, py); bg.lineTo(px + leaf, py - leaf * .7); bg.stroke();
        }
      }
      const vignette = bg.createRadialGradient(w / 2, h * .48, h * .15, w / 2, h * .5, Math.max(w, h) * .7);
      vignette.addColorStop(0, 'transparent'); vignette.addColorStop(1, '#010706cc');
      bg.fillStyle = vignette; bg.fillRect(0, 0, w, h);
    }

    function resize() {
      w = innerWidth; h = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
      for (const element of [canvas, scenery]) { element.width = Math.round(w * dpr); element.height = Math.round(h * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); bg.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildForest();
      pointer.x = fairy.x = w * .55; pointer.y = fairy.y = h * .5;
      companions.forEach(p => { p.x = fairy.x + p.offsetX * fairy.facing; p.y = fairy.y + p.offsetY; });
      leaves.length = 0;
      if (paused) draw(0);
    }

    function drawFairy(t, position, size, main = false) {
      const x = position.x, y = position.y + Math.sin(t * 1.8) * 2;
      ctx.save(); ctx.globalAlpha = pointer.strength;
      ctx.translate(x, y); ctx.scale(size, size);
      glow(ctx, 0, 0, 32, '188,226,147', .23);
      if (main) {
        ctx.strokeStyle = '#d9edbc'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
        ctx.shadowColor = '#d9edbc'; ctx.shadowBlur = 5;
        for (const side of [-1, 1]) {
          const stride = Math.sin(fairy.step + (side === 1 ? Math.PI : 0)) * fairy.walk * fairy.facing;
          const footX = side * 3 + stride * 5, footY = 20 - Math.max(0, stride * fairy.facing) * 3;
          ctx.beginPath(); ctx.moveTo(side * 2, 7);
          ctx.quadraticCurveTo(side * 2 + stride * 3, 13, footX, footY);
          ctx.lineTo(footX + fairy.facing * 3, footY); ctx.stroke();
          ctx.fillStyle = '#d9edbc'; ctx.beginPath();
          ctx.ellipse(footX + fairy.facing * 1.5, footY, 2.4, .85, 0, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (lightImage) {
        const ratio = lightImage.naturalHeight / lightImage.naturalWidth;
        ctx.drawImage(lightImage, -30, -30 * ratio, 60, 60 * ratio);
      } else {
      const flap = .65 + Math.sin(t * 4.2) * .25;
      for (const side of [-1, 1]) {
        ctx.save(); ctx.scale(side * flap, 1); ctx.rotate(-.2);
        ctx.fillStyle = 'rgba(199,235,206,.26)'; ctx.strokeStyle = 'rgba(223,251,215,.5)'; ctx.lineWidth = .6;
        ctx.beginPath(); ctx.ellipse(12, -8, 13, 6, -.65, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(9, 3, 9, 4, .4, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
      }
      ctx.shadowColor = '#e5ffd0'; ctx.shadowBlur = 13; ctx.fillStyle = '#e5f6c9';
      ctx.beginPath(); ctx.arc(0, -9, 2.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, -5); ctx.quadraticCurveTo(-2, 2, -6, 9); ctx.quadraticCurveTo(0, 7, 5, 10); ctx.quadraticCurveTo(2, 1, 0, -5); ctx.fill();
      }
      if (main && !(cameraStream && faceCrop && video.readyState >= 2)) {
        ctx.save(); ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = 5; ctx.shadowColor = '#e5ffd0'; ctx.fillStyle = '#e5f6c9';
        ctx.beginPath(); ctx.arc(0, -12, 6.8, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = '#304630';
        for (const eye of [-2.3, 2.3]) { ctx.beginPath(); ctx.ellipse(eye, -13.2, .7, .95, 0, 0, Math.PI * 2); ctx.fill(); }
        ctx.strokeStyle = '#49623c'; ctx.lineWidth = .7; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-2.5, -10.5); ctx.quadraticCurveTo(0, -7.8, 2.5, -10.5); ctx.stroke();
        ctx.restore();
      }
      if (main && cameraStream && faceCrop && video.readyState >= 2) {
        ctx.save(); ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(0, -12, 6.8, 0, Math.PI * 2); ctx.clip(); ctx.scale(-1, 1);
        const crop = zoomedFaceCrop(faceCrop, video.videoWidth, video.videoHeight);
        ctx.drawImage(video, crop.x, crop.y, crop.side, crop.side, -6.8, -18.8, 13.6, 13.6); ctx.restore();
      }
      ctx.restore();
    }

    function draw(dt) {
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
      pointer.active = performance.now() - lastMove < 180;
      const arriving = Number.isFinite(lastMove) && Math.hypot(pointer.x - fairy.x, pointer.y - fairy.y) > 3;
      const awake = pointer.active || arriving;
      const rate = awake ? 3.2 : 1.25;
      pointer.strength += ((awake ? 1 : 0) - pointer.strength) * (1 - Math.exp(-dt * rate));
      if (pointer.strength < .002 && !awake) pointer.strength = 0;
      ctx.globalAlpha = pointer.strength * .65;
      if (forestImage) {
        const scale = Math.max(w / forestImage.naturalWidth, h / forestImage.naturalHeight);
        const iw = forestImage.naturalWidth * scale, ih = forestImage.naturalHeight * scale;
        ctx.drawImage(forestImage, (w - iw) / 2, (h - ih) / 2, iw, ih);
        ctx.fillStyle = '#0009'; ctx.fillRect(0, 0, w, h);
      } else ctx.drawImage(scenery, 0, 0, w, h);
      const ease = 1 - Math.exp(-dt * 1.35);
      if (Math.abs(pointer.x - fairy.x) > .75) fairy.facing = pointer.x > fairy.x ? 1 : -1;
      const distance = Math.hypot(pointer.x - fairy.x, pointer.y - fairy.y);
      fairy.walk += (Math.min(1, distance / 35) - fairy.walk) * (1 - Math.exp(-dt * 5));
      fairy.step += dt * 3.2 * fairy.walk;
      fairy.x += (pointer.x - fairy.x) * ease; fairy.y += (pointer.y - fairy.y) * ease;
      companions.forEach((p, i) => {
        const phase = time * (.47 + i * .09) + i * 2.3;
        const follow = 1 - Math.exp(-dt * p.speed);
        const targetX = Math.max(15, Math.min(w - 15, fairy.x + p.offsetX * fairy.facing + Math.sin(phase) * 9));
        const targetY = Math.max(15, Math.min(h - 15, fairy.y + p.offsetY + Math.sin(phase * 1.3) * 8));
        p.x += (targetX - p.x) * follow;
        p.y += (targetY - p.y) * follow;
      });
      // Ease apart when paths cross, keeping the small fairies from bunching up.
      for (let i = 0; i < companions.length; i++) {
        for (let j = i + 1; j < companions.length; j++) {
          const a = companions[i], b = companions[j];
          const dx = b.x - a.x, dy = b.y - a.y, gap = Math.hypot(dx, dy);
          if (gap >= 34) continue;
          const push = (34 - gap) * .5 * (1 - Math.exp(-dt * 10));
          const nx = gap > .01 ? dx / gap : 0, ny = gap > .01 ? dy / gap : 1;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
        }
      }
      ctx.globalAlpha = pointer.strength;
      ctx.globalCompositeOperation = 'screen';
      if (pointer.strength > .001) {
        const radius = 112;
        const beam = ctx.createRadialGradient(fairy.x, fairy.y, 0, fairy.x, fairy.y, radius);
        beam.addColorStop(0, 'rgba(222,239,181,.34)');
        beam.addColorStop(.58, 'rgba(214,233,171,.29)');
        beam.addColorStop(.8, 'rgba(198,221,153,.19)');
        beam.addColorStop(1, 'rgba(198,221,153,0)');
        ctx.fillStyle = beam; ctx.beginPath(); ctx.arc(fairy.x, fairy.y, radius, 0, Math.PI * 2); ctx.fill();
      }
      for (const fly of flies) {
        const t = time * fly.speed + fly.phase;
        const x = fly.x * w + Math.sin(t) * 24, y = fly.y * h + Math.cos(t * .75) * 17;
        const pulse = .18 + (Math.sin(t * 2 + fly.phase) + 1) * .32;
        glow(ctx, x, y, fly.size * 10, '186,219,104', pulse * .18);
        ctx.fillStyle = `rgba(210,235,148,${pulse})`; ctx.beginPath(); ctx.arc(x, y, fly.size, 0, Math.PI * 2); ctx.fill();
      }
      for (const p of sparkles) {
        const angle = p.angle + time * .12;
        const x = fairy.x + Math.cos(angle) * p.radius;
        const y = fairy.y + Math.sin(angle) * p.radius * .7 + Math.sin(time * .7 + p.phase) * 4;
        const alpha = Math.pow(Math.max(0, Math.sin(time * p.speed + p.phase)), 4);
        glow(ctx, x, y, 10, '197,229,135', alpha * .25);
        ctx.fillStyle = `rgba(223,239,170,${alpha * .9})`; ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2); ctx.fill();
      }
      if (pointer.strength > .001) {
        drawFairy(time, fairy, 2.6, true);
        companions.forEach((p, i) => drawFairy(time + i + 1, p, .494));
      }
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      drawLeaves(dt);
    }

    function drawLeaves(dt) {
      for (let i = leaves.length - 1; i >= 0; i--) {
        const leaf = leaves[i]; leaf.life -= dt;
        if (leaf.life <= 0) { leaves.splice(i, 1); continue; }
        leaf.vy += dt * 24;
        leaf.x += (leaf.vx + Math.sin(leaf.life * 3 + leaf.phase) * 22) * dt;
        leaf.y += leaf.vy * dt; leaf.angle += leaf.spin * dt;
        ctx.save(); ctx.globalAlpha = Math.min(1, leaf.life / .9);
        ctx.translate(leaf.x, leaf.y); ctx.rotate(leaf.angle);
        ctx.scale(leaf.size, leaf.size * (.65 + Math.sin(leaf.life * 4 + leaf.phase) * .25));
        ctx.fillStyle = leaf.color; ctx.strokeStyle = '#d7e6ad'; ctx.lineWidth = .1;
        ctx.beginPath(); ctx.moveTo(-1, 0); ctx.bezierCurveTo(-.3, -1, .7, -.65, 1, 0);
        ctx.bezierCurveTo(.3, 1, -.7, .65, -1, 0); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-1, 0); ctx.lineTo(1, 0); ctx.stroke(); ctx.restore();
      }
    }

    function animate(now) {
      const dt = Math.min((now - last) / 1000 || .016, .05); last = now; time += dt;
      draw(dt); if (!paused) frame = requestAnimationFrame(animate);
    }
    canvas.addEventListener('pointermove', event => {
      pointer.x = event.clientX; pointer.y = event.clientY; lastMove = performance.now(); pointer.active = true;
    });
    canvas.addEventListener('click', event => {
      if (paused) return;
      pointer.x = event.clientX; pointer.y = event.clientY; lastMove = performance.now();
      for (let i = 0; i < 14; i++) {
        leaves.push({ x: event.clientX, y: event.clientY, vx: (Math.random() - .5) * 130, vy: -35 - Math.random() * 65, life: 2.4 + Math.random() * 1.6, size: 5 + Math.random() * 5, angle: Math.random() * Math.PI * 2, spin: (Math.random() - .5) * 3, phase: Math.random() * Math.PI * 2, color: ['#8da765', '#b3bd79', '#688c63'][i % 3] });
      }
      if (leaves.length > 140) leaves.splice(0, leaves.length - 140);
    });
    const leave = () => { lastMove = -Infinity; pointer.active = false; };
    canvas.addEventListener('pointerleave', leave); canvas.addEventListener('pointercancel', leave);
    canvas.addEventListener('pointerup', event => { if (event.pointerType !== 'mouse') leave(); });
    document.querySelector('#pause').addEventListener('click', event => {
      paused = !paused; event.currentTarget.setAttribute('aria-pressed', String(paused));
      event.currentTarget.textContent = paused ? '다시 움직이기' : '움직임 멈추기';
      if (paused) cancelAnimationFrame(frame); else { last = performance.now(); frame = requestAnimationFrame(animate); }
    });
    document.querySelector('#fullscreen').addEventListener('click', async () => {
      try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
      catch { status.textContent = '전체 화면은 Chrome에서 F11 키로도 열 수 있어요.'; }
    });
    document.addEventListener('fullscreenchange', () => { document.querySelector('#fullscreen').textContent = document.fullscreenElement ? '전체 화면 닫기' : '전체 화면'; });
    document.addEventListener('visibilitychange', () => { last = performance.now(); });
    for (const [id, kind] of [['forest-file', '숲'], ['light-file', '불빛']]) {
      let version = 0;
      document.getElementById(id).addEventListener('change', async event => {
        const file = event.target.files[0]; if (!file) return;
        const current = ++version, url = URL.createObjectURL(file), image = new Image();
        try {
          image.src = url; await image.decode();
          if (current !== version) return;
          if (kind === '숲') forestImage = image; else lightImage = image;
          status.textContent = `${kind} 이미지를 바꿨어요. 마우스를 움직여 확인하세요.`;
          if (paused) draw(0);
        } catch { if (current === version) { event.target.value = ''; status.textContent = '이미지를 열 수 없어요. PNG, JPG, WebP 파일을 선택해 주세요.'; } }
        finally { URL.revokeObjectURL(url); }
      });
    }
    const cameraOn = document.querySelector('#camera-on'), cameraOff = document.querySelector('#camera-off');
    async function loadFaceDetector() {
      if (!detectorPromise) {
        detectorPromise = (async () => {
          const { FaceDetector, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/vision_bundle.mjs');
          const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm');
          return FaceDetector.createFromOptions(files, {
            baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite', delegate: 'CPU' },
            runningMode: 'VIDEO', minDetectionConfidence: .55
          });
        })().catch(error => { detectorPromise = null; throw error; });
      }
      return detectorPromise;
    }
    function setFaceMessage(message) { if (faceStatus.textContent !== message) faceStatus.textContent = message; }
    function cropFromBox(box, width, height) {
      const side = Math.min(Math.max(box.width, box.height) * 1.25, width, height);
      return { x: Math.max(0, Math.min(width - side, box.originX + box.width / 2 - side / 2)), y: Math.max(0, Math.min(height - side, box.originY + box.height / 2 - side / 2)), side };
    }
    function zoomedFaceCrop(crop, width, height) {
      const side = Math.min(crop.side / faceZoom, width, height);
      return { x: Math.max(0, Math.min(width - side, crop.x + crop.side / 2 - side / 2)), y: Math.max(0, Math.min(height - side, crop.y + crop.side / 2 - side / 2)), side };
    }
    zoomSlider.addEventListener('input', () => {
      faceZoom = Math.max(.8, Math.min(3, Number(zoomSlider.value)));
      const label = `${faceZoom.toFixed(1)}배`;
      document.querySelector('#zoom-value').textContent = label;
      zoomSlider.setAttribute('aria-valuetext', label);
      if (paused) draw(0);
    });
    function trackFace(now) {
      if (!cameraStream || !faceDetector) return;
      if (video.readyState >= 2 && now - lastDetection >= 100 && video.currentTime !== lastVideoTime) {
        lastDetection = now; lastVideoTime = video.currentTime;
        try {
          const detections = faceDetector.detectForVideo(video, now).detections;
          const boxes = detections.map(d => d.boundingBox).filter(b => b && b.width > 0 && b.height > 0);
          const box = boxes.sort((a, b) => b.width * b.height - a.width * a.height)[0];
          if (box) {
            const next = cropFromBox(box, video.videoWidth, video.videoHeight);
            if (faceCrop && Math.hypot(next.x - faceCrop.x, next.y - faceCrop.y) < next.side * .5) {
              for (const key of ['x', 'y', 'side']) faceCrop[key] += (next[key] - faceCrop[key]) * .4;
            } else faceCrop = next;
            faceSeen = now; setFaceMessage('얼굴을 찾았어요 · 요정과 연결됨');
          } else if (now - faceSeen > 450) {
            faceCrop = null; setFaceMessage('얼굴을 찾고 있어요');
          }
          if (paused) draw(0);
        } catch {
          stopCamera(); status.textContent = '얼굴 인식이 중단됐어요. 웹캠 켜기를 눌러 다시 시도해 주세요.';
          return;
        }
      }
      faceFrame = requestAnimationFrame(trackFace);
    }
    function stopCamera() {
      cameraRequest++;
      cancelAnimationFrame(faceFrame); faceFrame = null; faceCrop = null;
      lastDetection = -Infinity; lastVideoTime = -1; faceSeen = -Infinity;
      if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null; video.srcObject = null; cameraOn.disabled = false; cameraOff.disabled = true;
      cameraOrb.classList.remove('live'); setFaceMessage('웹캠을 켜면 당신이 요정이 됩니다');
      if (paused) draw(0);
    }
    cameraOn.addEventListener('click', async () => {
      const request = ++cameraRequest; cameraOn.disabled = true; cameraOff.disabled = false;
      status.textContent = 'Chrome에서 카메라 사용을 허용해 주세요.';
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('unsupported');
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false });
        if (request !== cameraRequest) { stream.getTracks().forEach(track => track.stop()); return; }
        cameraStream = stream; video.srcObject = stream; await video.play();
        if (request !== cameraRequest) return;
        cameraOrb.classList.add('live'); setFaceMessage('얼굴 인식을 준비하고 있어요');
        stream.getVideoTracks()[0].addEventListener('ended', () => { if (cameraStream === stream) { stopCamera(); status.textContent = '웹캠 연결이 종료되었어요.'; } });
        status.textContent = '얼굴 인식 파일을 불러오고 있어요. 처음에는 잠시 걸릴 수 있어요.';
        const detector = await loadFaceDetector();
        if (request !== cameraRequest) return;
        faceDetector = detector; setFaceMessage('얼굴을 찾고 있어요');
        status.textContent = '얼굴이 보이도록 카메라를 바라보고 마우스를 움직여 보세요.';
        faceFrame = requestAnimationFrame(trackFace);
      } catch (error) {
        if (request !== cameraRequest) return;
        stopCamera();
        status.textContent = error.name === 'NotAllowedError' ? '카메라 사용이 허용되지 않았어요. Chrome의 카메라 권한을 확인해 주세요.' : error.name === 'NotFoundError' || error.name === 'NotReadableError' ? '웹캠 연결 상태와 다른 앱의 카메라 사용 여부를 확인해 주세요.' : '얼굴 인식을 준비하지 못했어요. 인터넷 연결을 확인하고 웹캠 켜기를 다시 눌러 주세요.';
      }
    });
    cameraOff.addEventListener('click', () => { stopCamera(); status.textContent = '웹캠을 껐어요.'; });
    addEventListener('pagehide', stopCamera);
    addEventListener('resize', resize);
    resize();
    if (reduced) document.querySelector('#pause').click(); else frame = requestAnimationFrame(animate);
  </script>
</body>
</html>
